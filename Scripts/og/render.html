<!doctype html><meta charset="utf-8"><title>og render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="gl"></canvas><canvas id="out"></canvas>
<pre id="status">rendering…</pre>
<script src="/web/puff.glsl.js"></script>
<script>
const P = new URLSearchParams(location.search);
const num = (k, d) => P.has(k) ? parseFloat(P.get(k)) : d;
const W = num('w', 2400), H = num('h', 1260);
const SIZE = num('size', 1700), EXP = num('exp', 0.92), TRAIL = num('trail', 1.0),
      FLOW = num('flow', 0.6), TIME = num('time', 120), DENS = num('dens', 1.0),
      CX = num('cx', W / 2), CY = num('cy', H / 2);
const glc = document.getElementById('gl'); glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', {preserveDrawingBuffer: true, alpha: true, premultipliedAlpha: true});
// The app's noise is scaled to the puff's radius, which is right for a
// 100 px puff and soft on a 2000 px one. 'detail' adds octaves of fbm and
// a finer, stronger grain for stills, patched into the shared source here so
// the app's shader stays as it is.
const DETAIL = num('detail', 0);
let GLSL = PUFF_GLSL;
if (DETAIL > 0) {
  GLSL = GLSL.replace('for (int i = 0; i < 5; i++)', `for (int i = 0; i < ${5 + Math.round(DETAIL)}; i++)`)
    .replace('uv * (6.5 / R) * exp2(-fi)', `uv * (${(6.5 * (1 + DETAIL)).toFixed(1)} / R) * exp2(-fi)`)
    .replace('(0.96 + 0.06 * grain)', `(${(1 - 0.06 * (1 + DETAIL) / 2).toFixed(3)} + ${(0.06 * (1 + DETAIL)).toFixed(3)} * grain)`);
}
const FRAG = `#version 300 es
precision highp float;
${GLSL}
uniform vec2 uCentre; uniform float uSize; uniform float uTime;
uniform float uExpansion; uniform float uTrail; uniform float uFlow; uniform vec4 uTint;
out vec4 fragColor;
void main(){ vec2 p = gl_FragCoord.xy - uCentre; p.y = -p.y;
  fragColor = render(p + 0.5*vec2(uSize), vec2(uSize), uTime, uExpansion, uTrail, uFlow, uTint); }`;
const VERT = `#version 300 es
in vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'aPos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
gl.viewport(0,0,W,H);
gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
// The puff growing, left to right: a dense wisp swelling into a thin cloud.
// x is a fraction of the width; size/exp/trail/flow/time are shader inputs.
const FRAMES = JSON.parse(P.get('frames') ?? '[]');
for (const f of FRAMES.length ? FRAMES : [{x:0.5,size:SIZE,exp:EXP,trail:TRAIL,flow:FLOW,time:TIME,dens:DENS}]) {
  gl.uniform2f(U('uCentre'), f.x * W, H - (f.y ?? 0.5) * H); gl.uniform1f(U('uSize'), f.size);
  gl.uniform1f(U('uTime'), f.time); gl.uniform1f(U('uExpansion'), f.exp);
  gl.uniform1f(U('uTrail'), f.trail ?? f.exp); gl.uniform1f(U('uFlow'), f.flow);
  gl.uniform4f(U('uTint'), 1, 1, 1, f.dens ?? 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Composite: paper, then the puff.
const out = document.getElementById('out'); out.width = W; out.height = H;
const cx = out.getContext('2d');
{
  cx.fillStyle = '#0e0e0e'; cx.fillRect(0, 0, W, H);
  cx.drawImage(glc, 0, 0);
  out.toBlob(b => b.arrayBuffer().then(a => fetch('/save?name=' + (P.get('name') || 'og') + '.png', {method: 'POST', body: a})
    .then(r => r.text()).then(t => { document.getElementById('status').textContent = 'SAVED ' + t; document.title = 'SAVED'; })), 'image/png');
}
</script>
