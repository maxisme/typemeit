# Every request is served from ./web as a static file, except the release assets
# -- /download, /appcast.xml and /download/<tag>/TypeMeIt.dmg -- which worker.js
# answers by streaming them from the GitHub release.
name = "typemeit-web-dev"
main = "worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./web"
binding = "ASSETS"

[env.production]
name = "typemeit-web"
routes = [{ pattern = "typeme.it", custom_domain = true }]

[env.production.assets]
directory = "./web"
binding = "ASSETS"
