  :root { --paper: #0e0e0e; --ink: #f0f0f0; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #err {
    position: fixed; left: 16px; top: 16px; margin: 0; padding: 12px;

  #err:empty { display: none; }

  /* A button over the puff rather than a hit test on the canvas, so it gets
     keyboard focus. A button rather than an anchor so hovering shows no DMG
     URL in the status bar. On a desktop with a real pointer, hovering shows
     the hand and turns the puff green; touch devices get neither. Circular so
     the corners of its box do not swallow clicks that miss the cloud. The

     is the same circle. */

<!-- Generated from TypeMeIt/Overlay/Puff.metal by web/generate.py. -->
<script src="puff.glsl.js"></script>
<script>
"use strict";

// iPadOS Safari reports "MacIntel" as its platform, so a touch screen is the
// tell that a "Mac" is actually an iPad.
const isMac = () => /mac/i.test(navigator.userAgentData?.platform ?? navigator.platform)
  && navigator.maxTouchPoints < 2;
const DMG = "https://github.com/maxisme/typemeit/releases/latest/download/TypeMeIt.dmg";
document.getElementById("download").addEventListener("click", () => {
  if (isMac()) { location.href = DMG; return; }
  document.getElementById("notmac").textContent = "Type Me It is macos only.";
});

// Reveal the links on the first attempt to scroll down: a wheel, a downward
// swipe, or a scroll key. Every listener is passive and removes itself.
{
  const more = document.getElementById("more");
  const scrollKeys = new Set(["ArrowDown", "PageDown", "End", " "]);
  let touchY = null;
  const reveal = () => {
    more.classList.add("shown");
    removeEventListener("wheel", onWheel);
    removeEventListener("touchstart", onTouchStart);
    removeEventListener("touchmove", onTouchMove);
    removeEventListener("keydown", onKey);
  };
  const onWheel = (ev) => { if (ev.deltaY > 0) reveal(); };
  const onTouchStart = (ev) => { touchY = ev.touches[0].clientY; };
  const onTouchMove = (ev) => { if (touchY !== null && touchY - ev.touches[0].clientY > 24) reveal(); };
  const onKey = (ev) => { if (scrollKeys.has(ev.key) && ev.target === document.body) reveal(); };
  addEventListener("wheel", onWheel, { passive: true });
  addEventListener("touchstart", onTouchStart, { passive: true });
  addEventListener("touchmove", onTouchMove, { passive: true });
  addEventListener("keydown", onKey);
}

// The shared shader renders one puff centred in a `size` square, exactly as
// the Swift view does. Here that square is a fixed VIEW px wide in the middle
// of the page, and the y axis is flipped because gl_FragCoord runs upwards
// while the shader (like SwiftUI) expects y down: its light comes from the top.
const VIEW = 440;

const FRAG = `#version 300 es
precision highp float;
${PUFF_GLSL}
uniform vec2 uCentre;
uniform float uSize;
uniform float uTime;
uniform float uExpansion;
uniform float uTrail;
uniform float uFlow;
uniform vec4 uTint;
out vec4 fragColor;
void main() {
  vec2 p = gl_FragCoord.xy - uCentre;
  p.y = -p.y;
  fragColor = render(p + 0.5 * vec2(uSize), vec2(uSize), uTime, uExpansion, uTrail, uFlow, uTint);
}
`;

const VERT = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// Ports of PuffView.Trail and PuffView.Dynamics. The constants here mirror the
// Swift; change them together.

/** Peak-hold on the expansion with a slow decay, so a retreat leaves a trail. */
class Trail {
  value = 0; last = null;
  constructor(tau = 1.4) { this.tau = tau; }
  step(expansion, now) {
    if (this.last === null) { this.last = now; this.value = expansion; return this.value; }
    const dt = Math.min(Math.max(now - this.last, 0), 0.1);
    this.last = now;
    this.value += (expansion - this.value) * (1 - Math.exp(-dt / this.tau));
    this.value = Math.max(this.value, expansion);
    return this.value;
  }
}

/**
 * Turns a 0...1 level into expansion, trail and flow. The level is followed
 * with a fast attack and a slow release, so every syllable moves the puff
 * and it breathes out between them, streaming smoke on each rise.
 */
class Dynamics {
  static attack = 0.012; static release = 0.22; static gain = 0.75; static rest = 0.44;
  env = 0; flow = 0; last = null; trail = new Trail(0.8);
  static restExpansion(level) { return Dynamics.rest + Dynamics.gain * Math.min(Math.max(level, 0), 1); }
  step(level, now) {
    if (this.last === null) {
      this.last = now; this.env = level;
      const e = Dynamics.restExpansion(level);
      return { expansion: e, trail: this.trail.step(e, now), flow: this.flow };
    }
    const dt = Math.min(Math.max(now - this.last, 0), 0.1);
    this.last = now;
    const tau = level > this.env ? Dynamics.attack : Dynamics.release;
    const before = this.env;
    this.env += (level - this.env) * (1 - Math.exp(-dt / tau));
    const e = Math.min(1, Math.max(0.05, Dynamics.restExpansion(this.env)));
    this.flow += dt * (0.08 + 6 * Math.max(0, this.env - before));
    return { expansion: e, trail: this.trail.step(e, now), flow: this.flow };
  }
}

// Pointer: the puff stays in the middle of the page; the pointer's speed is
// the level, so a flick of the mouse is a syllable, and a click is a shout.
// The raw speed is heavily smoothed and then eased into the level, so the puff
// swells behind the cursor rather than twitching with every event. The
// position starts at the centre so the first move measures a sane distance;
// `seen` says whether it is a real position yet.
const pointer = { x: innerWidth / 2, y: innerHeight / 2, t: performance.now(), speed: 0, level: 0, pressed: 0, seen: false };
const POINTER = { speedBlend: 0.12, speedFull: 3200, rest: 0.6, attack: 0.35, release: 0.9 };
addEventListener("pointermove", (ev) => {
  const now = performance.now();
  const dt = Math.max((now - pointer.t) / 1000, 1 / 240);
  const d = Math.hypot(ev.clientX - pointer.x, ev.clientY - pointer.y);
  pointer.speed += ((d / dt) - pointer.speed) * POINTER.speedBlend;
  pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.t = now; pointer.seen = true;
});
addEventListener("pointerdown", (ev) => {
  pointer.pressed = performance.now();
  // A click on the puff itself flushes it red; a click on empty page toggles
  // the inversion. The links at the bottom do neither.
  const d = Math.hypot(ev.clientX - innerWidth / 2, ev.clientY - innerHeight / 2);
  if (d < HOVER_RADIUS) blush = performance.now();
  else if (ev.target === canvas || ev.target === document.body) inverted = !inverted;
});

// A click on the puff flushes it red, easing back over BLUSH seconds. A click
// on empty page toggles the inversion outright: white paper, black cloud,
// with no fade. The smoke tint is the product of the two.
const BLUSH = 4.0;
const BLUSH_TINT = [1.0, 0.25, 0.22];
const DARK = { paper: "#0e0e0e", ink: "#f0f0f0", tint: [1.0, 1.0, 1.0] };
const LIGHT = { paper: "#f0f0f0", ink: "#0e0e0e", tint: [0.08, 0.08, 0.08] };
let blush = -Infinity;
let inverted = false;
let shownInverted = null;

// Hovering the puff on a desktop pointer fades it green, in over HOVER_IN
// seconds and out over HOVER_OUT, so it neither flickers at the edge nor
// lingers. Hover is a distance test on the pointer against the same circle
// as the #download button, so the green and the hand agree. Touch devices
// never hover, and neither does a page the mouse has not moved over yet.
const HOVER_TINT = [0.45, 0.9, 0.5];
const HOVER_RADIUS = 90;
const HOVER_IN = 0.6, HOVER_OUT = 0.45;
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
let hover = 0, hoverAt = null;

function hoverAmount(nowMs) {
  const d = Math.hypot(pointer.x - innerWidth / 2, pointer.y - innerHeight / 2);
  const hovering = canHover && pointer.seen && d < HOVER_RADIUS;
  const dt = hoverAt === null ? 0 : Math.min((nowMs - hoverAt) / 1000, 0.1);
  hoverAt = nowMs;
  const target = hovering ? 1 : 0;
  hover += (target - hover) * (1 - Math.exp(-dt / (hovering ? HOVER_IN : HOVER_OUT)));
  return hover;
}

function tint(nowMs) {
  if (inverted !== shownInverted) {
    shownInverted = inverted;
    const scheme = inverted ? LIGHT : DARK;
    document.documentElement.style.setProperty("--paper", scheme.paper);
    document.documentElement.style.setProperty("--ink", scheme.ink);
  }
  const k = Math.max(0, 1 - (nowMs - blush) / (BLUSH * 1000));
  const amount = k * k * (3 - 2 * k);
  const base = (inverted ? LIGHT : DARK).tint;
  const h = hoverAmount(nowMs);
  return base.map((c, i) => (c + (HOVER_TINT[i] - c) * h) * (1 + (BLUSH_TINT[i] - 1) * amount));
}

const canvas = document.getElementById("c");
const err = document.getElementById("err");
const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false });
if (!gl) { err.textContent = "WebGL 2 is not available in this browser."; }

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

let program, uniforms;
try {
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  uniforms = Object.fromEntries(["uCentre", "uSize", "uTime", "uExpansion", "uTrail", "uFlow", "uTint"]
    .map((n) => [n, gl.getUniformLocation(program, n)]));
} catch (e) {
  err.textContent = String(e.message || e);
}

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dynamics = new Dynamics();
const start = performance.now();
let dpr = 1;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener("resize", resize);
resize();

let lastFrame = start;
function frame(nowMs) {
  const now = (nowMs - start) / 1000;
  const dt = Math.min((nowMs - lastFrame) / 1000, 0.1);
  lastFrame = nowMs;

  // Speed decays once the pointer rests, and the level follows it with a
  // slow attack and slower release.
  if (nowMs - pointer.t > 40) pointer.speed *= Math.exp(-dt / POINTER.rest);
  let target = Math.min(1, pointer.speed / POINTER.speedFull);
  if (nowMs - pointer.pressed < 90) target = 1;
  const tau = target > pointer.level ? POINTER.attack : POINTER.release;
  pointer.level += (target - pointer.level) * (1 - Math.exp(-dt / tau));
  const level = pointer.level;

  const s = reduceMotion
    ? { expansion: 0.5, trail: 0.5, flow: 0 }
    : dynamics.step(level, now);
  const time = reduceMotion ? 100 : now;

  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uniforms.uCentre, canvas.width / 2, canvas.height / 2);
  gl.uniform1f(uniforms.uSize, VIEW * dpr);
  gl.uniform1f(uniforms.uTime, time);
  gl.uniform1f(uniforms.uExpansion, s.expansion);
  gl.uniform1f(uniforms.uTrail, s.trail);
  gl.uniform1f(uniforms.uFlow, s.flow);
  const [tr, tg, tb] = tint(nowMs);
  gl.uniform4f(uniforms.uTint, tr, tg, tb, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (!reduceMotion) requestAnimationFrame(frame);
}
if (program) requestAnimationFrame(frame);
</script>
</body>
